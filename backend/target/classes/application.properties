server.port=5000

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:MusicSystemDB2}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:spotify123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# MinIO
minio.endpoint=http://${MINIO_ENDPOINT:localhost}:${MINIO_PORT:9002}
minio.accessKey=${MINIO_USER:admin}
minio.secretKey=${MINIO_PASSWORD:spotify123}
minio.bucket=${MINIO_BUCKET:music}

# JWT
jwt.secret=SpotifyCloudProjectSecretKey2026VeryLongSecretForSecurity
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:3000

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
