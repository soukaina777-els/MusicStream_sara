version: '3.8'

services:

  # === BD ===
  postgres:
    image: elouansaidi/mysql-db:v2
    container_name: mysql-music-last
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: spotify123
      MYSQL_DATABASE: MusicSystemDB2
    restart: always
    networks:
      - spotify_net

    volumes:
      - mysql_data:/var/lib/mysql


  # === BACKEND Spring Boot ===
  backend:
    image: elouansaidi/spotify-backend:v1
    container_name: spotify-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: postgres
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: spotify123
      MYSQL_DATABASE: MusicSystemDB2
      MINIO_ENDPOINT: 10.169.247.237
      MINIO_PORT: 9000
      MINIO_USER: admin
      MINIO_PASSWORD: spotify123
      MINIO_BUCKET: artists
      TZ: Africa/Casablanca
    depends_on:
      - postgres
    networks:
      - spotify_net
    volumes:
    - /etc/localtime:/etc/localtime:ro
 
  # === FRONTEND React ===
  frontend:
    image: elouansaidi/spotify-frontend:v2
    container_name: spotify-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - spotify_net

  # === REVERSE PROXY ===
  nginx:
    image: nginx:alpine
    container_name: spotify-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - spotify_net

  # === SUPERVISION ===
  prometheus:
    image: prom/prometheus:latest
    container_name: spotify-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always
    networks:
      - spotify_net

  grafana:
    image: grafana/grafana:latest
    container_name: spotify-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    networks:
      - spotify_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: spotify-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    networks:
      - spotify_net

volumes:
  grafana_data:
  mysql_data:

networks:
  spotify_net:
    driver: bridge


